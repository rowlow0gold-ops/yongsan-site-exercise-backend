name: Deploy pop-backend (one-off, borrowed runner)
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: [self-hosted, home]
    steps:
      - name: Clone & compose pop-backend on homeserver
        run: |
          set -e
          mkdir -p "$HOME/apps" && cd "$HOME/apps"
          rm -rf pop-backend
          git clone https://github.com/rowlow0gold-ops/pop-backend.git
          cd pop-backend
          if docker compose version >/dev/null 2>&1; then DC="docker compose"; else DC="docker-compose"; fi
          $DC up -d --build
          echo "waiting for health..."
          for i in $(seq 1 50); do
            if curl -fsS http://localhost:8086/api/health >/dev/null 2>&1; then
              echo "HEALTHY:"; curl -s http://localhost:8086/api/health; echo; exit 0
            fi
            sleep 4
          done
          echo "=== api logs ==="; $DC logs --tail=60 api || true
          exit 1
