name: Deploy Yongsan Backend

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "**/*.md"
  workflow_dispatch:

jobs:
  test:
    name: JUnit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Run tests
        run: ./gradlew test

  deploy:
    name: Build & Deploy (home server)
    needs: test
    runs-on: [self-hosted, home]
    steps:
      - name: Sync source on home server
        run: |
          cd /home/jj/apps/yongsan-site-exercise-backend
          git fetch origin main
          git reset --hard origin/main

      - name: Rebuild & restart backend (Spring Boot — slow)
        run: |
          cd /home/jj/apps/stack
          docker compose --env-file .env build yongsan-backend
          docker compose --env-file .env up -d --no-deps yongsan-backend

      - name: Wait for startup
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8081/actuator/health > /dev/null 2>&1; then
              echo "Backend healthy after ${i}x2s"
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed health check"
          exit 1
