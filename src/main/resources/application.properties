spring.application.name=demo

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=${GOOGLE_SCOPE}
spring.security.oauth2.client.registration.google.client-authentication-method=client_secret_basic
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth?prompt=select_account

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
# SQL logging is off in shared config; turn on locally with spring.profiles.active=local
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.jwt.secret=${JWT_SECRET}
app.jwt.accessTtlSeconds=60
app.jwt.refreshTtlSeconds=60
app.jwt.refreshCookieName=refresh_token

server.forward-headers-strategy=framework

app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:5173}



# Kakao OAuth2
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.scope=profile_nickname
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.client-name=Kakao

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize?prompt=select_account
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-info-authentication-method=header
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

# Sentry
sentry.dsn=${SENTRY_DSN:}
# Sample 10% of traces in prod (override via env for debugging). 1.0 used to be
# the default and was too costly + too much PII surface in Sentry breadcrumbs.
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.1}
sentry.environment=${SENTRY_ENV:local}
# Don't ship request bodies / sensitive headers to Sentry.
sentry.send-default-pii=false

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=${spring.application.name}

# Production error response hardening: never include stack traces, messages,
# or binding errors. Keeps internal class names and SQL fragments out of the
# response body when something explodes.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

app.turnstile.secret=${TURNSTILE_SECRET:}

# Resend (transactional email — verification, password reset)
app.email.resendApiKey=${RESEND_API_KEY:}
app.email.fromAddress=${EMAIL_FROM_ADDRESS:noreply@send.minhojan-world.site}
app.email.fromName=${EMAIL_FROM_NAME:용산구 홈페이지}
app.email.appBaseUrl=${APP_BASE_URL:http://localhost:5173}
